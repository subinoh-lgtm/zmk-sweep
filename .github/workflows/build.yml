on: [push, pull_request, workflow_dispatch]

name: Build Cradio Firmware

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Initialize west
        run: west init -l config

      - name: Update west modules
        run: west update

      - name: Export Zephyr CMake
        run: west zephyr-export

      # 🧩 Build Cradio Left
      - name: Build Cradio Left
        run: west build -s zmk/app -b nice_nano_v2 -- -DSHIELD=cradio_left -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Show Kconfig (Left)
        run: cat build/zephyr/.config | grep -v "^#" | grep -v "^$"

      - name: Rename UF2 (Left)
        run: cp build/zephyr/zmk.uf2 cradio_left_nice_nano_v2.uf2

      - name: Upload Firmware (Left)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cradio-left
          path: cradio_left_nice_nano_v2.uf2

      # 🧩 Build Cradio Right
      - name: Build Cradio Right
        run: west build --pristine -s zmk/app -b nice_nano_v2 -- -DSHIELD=cradio_right -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Show Kconfig (Right)
        run: cat build/zephyr/.config | grep -v "^#" | grep -v "^$"

      - name: Rename UF2 (Right)
        run: cp build/zephyr/zmk.uf2 cradio_right_nice_nano_v2.uf2

      - name: Upload Firmware (Right)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-cradio-right
          path: cradio_right_nice_nano_v2.uf2
